# Secret scanning: gitleaks over the whole git history on every push to main
# and every pull request. Fails if it finds anything that looks like a
# credential, and lists where on the run's Summary tab (the secret itself is
# redacted). GitHub-hosted runner: it takes about a minute.
#
# A false positive (a placeholder in docs, a test fixture) goes in
# .gitleaksignore as its fingerprint (commit:file:rule:line, shown in the
# report artifact). A real secret must be rotated first: removing it from the
# file does not remove it from git history.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The release tarball, checked against a pinned SHA-256, rather than a
      # third-party action.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan git history
        run: >
          gitleaks git --no-banner --redact --exit-code 1
          --report-format json --report-path gitleaks-report.json .

      - name: Secret scan summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "gitleaks-report.json"
          if not os.path.exists(path):
              print("## Secret scan: ⚠️ no report (the scan did not run)")
              raise SystemExit
          findings = json.load(open(path)) or []
          if not findings:
              print("## Secret scan: ✅ no secrets found in the git history")
              raise SystemExit
          print(f"## Secret scan: ❌ {len(findings)} possible secret(s)")
          print()
          print("| Rule | File | Line | Commit | Fingerprint |")
          print("|---|---|---:|---|---|")
          for f in findings:
              print(f"| {f['RuleID']} | `{f['File']}` | {f['StartLine']} | `{f['Commit'][:8]}` | `{f['Fingerprint']}` |")
          print()
          print("Rotate any real credential first: it stays in git history. "
                "A false positive goes in .gitleaksignore by its fingerprint.")
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
